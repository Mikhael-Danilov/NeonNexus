# Regenerates the Play Store screenshots (store-assets/screenshots) with headless
# Chromium + Playwright, and commits them back when they changed.
#
# Triggers:
#   - manual (Actions → "Regenerate Play Store screenshots" → Run workflow)
#   - push to main touching game assets or the generator script
#
# Commits appear as github-actions[bot]; the run also uploads the shots as an artifact
# for review even when nothing changed.

name: Regenerate Play Store screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - 'scripts/generate-screenshots.js'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright (outside the repo tree)
        run: |
          cd "$RUNNER_TEMP"
          npm i playwright --silent
          npx playwright install --with-deps chromium

      - name: Serve game assets
        run: |
          python3 -m http.server 8765 --directory app/src/main/assets &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8765/index.html >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/index.html >/dev/null

      - name: Generate screenshots
        run: NODE_PATH="$RUNNER_TEMP/node_modules" node scripts/generate-screenshots.js

      - name: Commit regenerated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store-assets/screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "ci: regenerate Play Store screenshots"
            git push
          fi

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-store-screenshots
          path: store-assets/screenshots/*.png
